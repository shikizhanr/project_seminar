[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "habit-coach"
version = "0.1.0"
description = "Intelligent habit coach with lapse prediction and personalization"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "aiosqlite>=0.20,<1",
  "asyncpg>=0.29,<1",
  "pydantic-settings>=2.5,<3",
  "email-validator>=2.2,<3",
  "pyjwt>=2.9,<3",
  "pwdlib[argon2]>=0.2,<1",
  "python-multipart>=0.0.12,<1",
  "redis>=5,<7",
  "scikit-learn>=1.5,<2",
  "numpy>=2,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
bot = ["python-telegram-bot>=21,<23"]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "coverage>=7,<8",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["backend", "bot"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
